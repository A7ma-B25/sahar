name: ui-test
# "ui-test all" is the title test-build looks for: a full pass on the same commit spares it the same run.
run-name: ui-test ${{ inputs.stages || 'all' }}

# Windows minutes are precious: on main pushes, or run by hand for a branch (gh workflow run ui-test.yml --ref <branch>).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stages:
        description: >-
          all (what a release runs), auto (only the stages the branch's changes since `base` touch, plus smoke:
          tools/ci/ui_stages.py), a comma-separated list, or mindeval (her real brain only)
        type: string
        default: all
      base:
        description: For stages=auto and mind_eval=auto — what the changes are counted from
        type: string
        default: origin/main
      mind_eval:
        description: Her real brain (mind-eval.yml) alongside — auto (when her brain's files changed since `base`), yes, or no
        type: choice
        options: [auto, 'yes', 'no']
        default: auto
      eval_model:
        description: For mind-eval — the pinned model (gemma-4-e4b-q4km or jais-3-7b-q4km)
        type: string
        default: gemma-4-e4b-q4km
      eval_only:
        description: For mind-eval — golden ids (comma-separated), or empty for all
        type: string
        default: ''

# A new run of the same stages on the same branch replaces the old one (all and mindeval can run side by side).
concurrency:
  group: ui-test-${{ github.ref }}-${{ inputs.stages || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # tools/ci/prior_runs.py: a mind-eval that already passed on this commit

jobs:
  # What runs: the stage list → parallel Windows jobs (tools/ci/ui_groups.py: all → nine groups, ≤ 3 stages → one
  # job), and whether her real brain is evaluated too.
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      mindeval: ${{ steps.mindeval.outputs.mindeval }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the diff against the base
      - name: Stages
        id: stages
        shell: bash
        env:
          STAGES: ${{ inputs.stages || 'all' }}
          BASE: ${{ inputs.base || 'origin/main' }}
        run: |
          case "$STAGES" in
            auto) python3 -I tools/ci/ui_stages.py stages --base "$BASE" | tee -a "$GITHUB_OUTPUT" ;;
            mindeval) echo "stages=" | tee -a "$GITHUB_OUTPUT" ;;
            *) echo "stages=$STAGES" | tee -a "$GITHUB_OUTPUT" ;;
          esac
      - name: Groups
        id: groups
        shell: bash
        env:
          STAGES: ${{ steps.stages.outputs.stages }}
        run: |
          if [ -z "$STAGES" ]; then echo 'groups=[]' | tee -a "$GITHUB_OUTPUT"
          else python3 -I tools/ci/ui_groups.py "$STAGES" | tee -a "$GITHUB_OUTPUT"; fi
      # 0.14.1 opt-in, now also automatic: her real brain (~25 min of Windows, in parallel) when stages=mindeval or
      # mind_eval=yes; on auto when her brain's files changed (since `base`; on a push, since the commit before it)
      # and no mind-eval has passed on this commit yet.
      - name: Mind-eval?
        id: mindeval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGES: ${{ inputs.stages || 'all' }}
          ASKED: ${{ inputs.mind_eval || 'auto' }}
          BASE: ${{ github.event_name == 'push' && github.event.before || inputs.base || 'origin/main' }}
        run: |
          if [ "$STAGES" = mindeval ] || [ "$ASKED" = yes ]; then on=true
          elif [ "$ASKED" = no ]; then on=false
          else
            git rev-parse --verify -q "$BASE^{commit}" >/dev/null || BASE=origin/main   # a push that made the branch
            brain=$(python3 -I tools/ci/ui_stages.py brain --base "$BASE")
            done=$(python3 -I tools/ci/prior_runs.py mindeval --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA")
            if [ "$brain" = brain=true ] && [ "$done" = run= ]; then on=true; else on=false; fi
            echo "$brain, prior mind-eval: $done"
          fi
          echo "mindeval=$on" | tee -a "$GITHUB_OUTPUT"

  mind-eval:
    needs: plan
    if: ${{ needs.plan.outputs.mindeval == 'true' }}
    uses: ./.github/workflows/mind-eval.yml
    with:
      model: ${{ inputs.eval_model || 'gemma-4-e4b-q4km' }}
      only: ${{ inputs.eval_only }}
      budget: '240'

  # The engine is built once and shared with every UI job.
  build:
    needs: plan
    if: ${{ needs.plan.outputs.groups != '[]' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # NuGet packages (the Native AOT compiler is the big one) and the pinned llama.cpp zips: by their pins.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
      - uses: actions/cache@v4
        with:
          path: artifacts/mind/downloads
          key: mind-runtime-vulkan-cpu-${{ hashFiles('tools/mind/pins.json') }}
      - name: Settings store on Windows (two writers, sharing violations, File.Replace)
        run: dotnet test tests/Sahar.Core.Tests -c Release --filter FullyQualifiedName~SettingsStore
      - name: Publish engine (Native AOT)
        run: dotnet publish src/Sahar.Engine -c Release -r win-x64 -o artifacts/engine
      - name: Publish the settings app (self-contained, next to the engine)
        run: dotnet publish src/Sahar.Settings -c Release -r win-x64 -o artifacts/engine/Sahar.Settings
      # 0.19 AOT gate: the MCP client package (ModelContextProtocol.Core 2.4.0) must add no trim/AOT warning (baseline 0).
      - name: Publish her brain's process (Native AOT, next to the engine; zero IL warnings)
        shell: pwsh
        run: |
          dotnet publish src/Sahar.Mind -c Release -r win-x64 -o artifacts/mind-exe 2>&1 | Tee-Object -FilePath mind-publish.log
          if ($LASTEXITCODE -ne 0) { throw "the Mind did not publish ($LASTEXITCODE)" }
          $il = @(Select-String -Path mind-publish.log -Pattern 'warning IL\d+' | ForEach-Object { $_.Line } | Sort-Object -Unique)
          Write-Host "Mind publish: $($il.Count) IL (trim/AOT) warning(s)"
          if ($il.Count) { $il | ForEach-Object { Write-Host "  $_" }; throw 'the Mind publish has trim/AOT warnings (0.19 gate: zero)' }
      # 0.19 CI only: the stdio MCP test program (the official SDK's server side) for the mind stage; never packaged.
      - name: The MCP test program (CI only)
        run: dotnet publish tests/fakes/McpFake -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/engine/ci-fakes
      - name: Her brain's runtime (official llama.cpp release, pinned SHA-256 and GitHub's digest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item artifacts/mind-exe/Sahar.Mind.exe artifacts/engine/
          ./tools/mind/fetch.ps1 -Runtime vulkan,cpu -Out artifacts/mind
          New-Item -ItemType Directory -Force -Path artifacts/engine/runtime | Out-Null
          Copy-Item artifacts/mind/runtime/cpu artifacts/engine/runtime/cpu -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: artifacts/engine/
          retention-days: 3
      # Sahar-Setup-<version>.exe (+ .sha256) for the "install" stage: pinned official Inno Setup, hash checked.
      # The UI stages' engine folder has the CPU runtime only; the setup takes both (Vulkan + CPU) from the fetch.
      - name: Installer
        shell: pwsh
        run: ./packaging/installer/build.ps1 -Version (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText -Runtime artifacts/mind/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/installer/
          retention-days: 3

  ui:
    needs: [plan, build]
    name: ui (${{ matrix.group.name }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent-desktop
        run: npm i -g agent-desktop@1.2.0
      - name: The WebView2 runtime is installed (the settings app needs it)
        shell: pwsh
        run: |
          $key = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = @("HKLM:\SOFTWARE\WOW6432Node\$key", "HKCU:\Software\$key") | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if (-not $pv) { throw 'The WebView2 runtime is not installed on this runner: the settings app cannot run.' }
          Write-Host "WebView2 runtime $pv"
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: artifacts/engine
      # The mind stage's tiny model (plan Ruling 4, 291.5 MB): cached by its pin; never the 5 GB model.
      - uses: actions/cache@v4
        if: contains(matrix.group.stages, 'mind')
        with:
          path: artifacts/mind/downloads
          key: mind-ci-model-${{ hashFiles('tools/mind/pins.json') }}
      - name: The mind stage's tiny model (pinned)
        if: contains(matrix.group.stages, 'mind')
        shell: pwsh
        run: ./tools/mind/fetch.ps1 -Model -Out artifacts/mind
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: artifacts/installer
      - name: UI tests (${{ matrix.group.stages }})
        shell: pwsh
        env:
          STAGES: ${{ matrix.group.stages }}
        run: ./tests/ui/run.ps1 -Stage ($env:STAGES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.group.name }}
          path: artifacts/ui/
