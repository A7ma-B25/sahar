name: ui-test

# Windows minutes are precious: on main pushes, or run by hand for a branch (gh workflow run ui-test.yml --ref <branch>).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stages:
        description: Stages to run (comma-separated); a task runs the ones it touches, a release runs them all
        type: string
        default: smoke,idle,gallery,motion,events,perf,life,menu,senses,prayer,games

concurrency:
  group: ui-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent-desktop
        run: npm i -g agent-desktop@1.2.0
      - name: Settings store on Windows (two writers, sharing violations, File.Replace)
        run: dotnet test tests/Sahar.Core.Tests -c Release --filter FullyQualifiedName~SettingsStore
      - name: Publish engine (Native AOT)
        run: dotnet publish src/Sahar.Engine -c Release -r win-x64 -o artifacts/engine
      - name: UI tests
        shell: pwsh
        env:
          STAGES: ${{ inputs.stages || 'smoke,idle,gallery,motion,events,perf,life,menu,senses,prayer,games' }}
        run: ./tests/ui/run.ps1 -Stage ($env:STAGES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui
          path: artifacts/ui/
