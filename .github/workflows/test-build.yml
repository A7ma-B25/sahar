name: test-build

# Builds the portable test build and the setup after every check passes; both are always kept as workflow artifacts.
# Publishing the "test-build" pre-release (publish: true) signs the update manifest Sahar trusts, so it is refused
# anywhere but main: a dispatch on a branch, or a tag push, stops at the signing step.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the "test-build" pre-release
        type: boolean
        default: false
  push:
    tags: ["v0.*-test"]
    # Until this workflow is on main (dispatch needs it there), packaging changes on v1 branches build the zip
    # as an artifact only; branch pushes never publish.
    branches: ["v1/**"]
    paths: ["packaging/**", ".github/workflows/test-build.yml"]

permissions:
  contents: write
  actions: read   # to find a full ui-test pass on this commit

concurrency:
  group: test-build
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Sahar.Core.Tests -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The settings page's pure JS (node --test)
        run: node --test "tests/web/*.test.mjs"
      - run: python3 -I -m unittest discover -s tools/art -p 'test_*.py' -v
      - run: python3 -I -m unittest discover -s tools/ci -p 'test_*.py' -v

  windows:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 50   # every stage in one job (settings, activities, mind and install included) + the installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent-desktop
        run: npm i -g agent-desktop@1.2.0
      - name: Publish engine (Native AOT)
        run: dotnet publish src/Sahar.Engine -c Release -r win-x64 -o artifacts/engine
      - name: Publish the settings app (self-contained, next to the engine)
        run: dotnet publish src/Sahar.Settings -c Release -r win-x64 -o artifacts/engine/Sahar.Settings
      - name: Publish her brain's process (Native AOT, next to the engine)
        run: dotnet publish src/Sahar.Mind -c Release -r win-x64 -o artifacts/mind-exe
      - name: Her brain's runtime (official llama.cpp release, pinned SHA-256 and GitHub's digest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item artifacts/mind-exe/Sahar.Mind.exe artifacts/engine/
          ./tools/mind/fetch.ps1 -Runtime vulkan,cpu -Out artifacts/mind
          New-Item -ItemType Directory -Force -Path artifacts/engine/runtime | Out-Null
          Copy-Item artifacts/mind/runtime/cpu artifacts/engine/runtime/cpu -Recurse
          Copy-Item artifacts/mind/runtime/vulkan artifacts/engine/runtime/vulkan -Recurse
      - name: The WebView2 runtime is installed (the settings app needs it)
        shell: pwsh
        run: |
          $key = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = @("HKLM:\SOFTWARE\WOW6432Node\$key", "HKCU:\Software\$key") | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if (-not $pv) { throw 'The WebView2 runtime is not installed on this runner: the settings app cannot run.' }
          Write-Host "WebView2 runtime $pv"
      # The mind stage's tiny model (plan Ruling 4, 291.5 MB, pinned): cached by its pin; never the 5 GB model.
      - uses: actions/cache@v4
        with:
          path: artifacts/mind/downloads
          key: mind-ci-model-${{ hashFiles('tools/mind/pins.json') }}
      - name: The mind stage's tiny model (pinned)
        shell: pwsh
        run: ./tools/mind/fetch.ps1 -Model -Out artifacts/mind
      - name: Version
        shell: pwsh
        run: |
          $v = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          "SAHAR_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Sahar-Setup-<version>.exe and its .sha256 (the in-app update checks it): pinned official Inno Setup.
      - name: Installer
        shell: pwsh
        run: ./packaging/installer/build.ps1 -Version $env:SAHAR_VERSION
      # Publishing a commit that already passed every UI stage (a successful "ui-test all" run on the same SHA):
      # only smoke and gallery run here (the release carries gallery.png). Otherwise every stage, as before.
      - name: A full UI pass on this commit?
        id: prior
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/${{ github.repository }}/actions/workflows/ui-test.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.display_title == "ui-test all")][0].id // empty')
          if [ -n "$run" ]; then echo "full UI pass on ${{ github.sha }}: run $run"; else echo "no full UI pass on ${{ github.sha }}"; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: UI tests (all stages)
        if: steps.prior.outputs.run == ''
        shell: pwsh
        run: ./tests/ui/run.ps1 -Stage smoke,idle,gallery,motion,events,perf,life,menu,senses,prayer,games,shell,face,settings,activities,mind,install
      - name: UI tests (smoke, gallery; ui-test run ${{ steps.prior.outputs.run }} passed every stage on this commit)
        if: steps.prior.outputs.run != ''
        shell: pwsh
        run: ./tests/ui/run.ps1 -Stage smoke,gallery
      - name: Package
        shell: pwsh
        run: |
          $dir = "artifacts/Sahar-$env:SAHAR_VERSION-test-win-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item artifacts/engine/Sahar.Engine.exe $dir
          Copy-Item artifacts/engine/Sahar.Mind.exe $dir
          Copy-Item artifacts/engine/Sahar.Settings $dir -Recurse
          # 0.14: llama-server ships for Vulkan only (its CPU backends run when there is no GPU); CUDA is downloaded on his yes.
          New-Item -ItemType Directory -Force -Path "$dir/runtime" | Out-Null
          Copy-Item artifacts/engine/runtime/vulkan "$dir/runtime/vulkan" -Recurse
          Copy-Item packaging/THIRD-PARTY.txt $dir
          Get-ChildItem "$dir/Sahar.Settings" -Filter *.pdb -Recurse | Remove-Item
          Copy-Item packaging/README-test-build.txt $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip" -Force
          $names = (Get-ChildItem $dir).Name | Sort-Object
          Write-Host "zip contains: $($names -join ', ')"
          if (($names -join ',') -ne 'README-test-build.txt,runtime,Sahar.Engine.exe,Sahar.Mind.exe,Sahar.Settings,THIRD-PARTY.txt') { throw "unexpected zip contents: $names" }
          if (-not (Test-Path "$dir/runtime/vulkan/llama-server.exe")) { throw 'the runtime is incomplete' }
          if (-not (Test-Path "$dir/Sahar.Settings/Sahar.Settings.exe") -or -not (Test-Path "$dir/Sahar.Settings/web/index.html")) { throw 'the settings app is incomplete' }
          Write-Host ("zip size: {0:0.0} MB" -f ((Get-Item "$dir.zip").Length / 1MB))
      - uses: actions/upload-artifact@v4
        with:
          name: Sahar-${{ env.SAHAR_VERSION }}-test-win-x64
          path: artifacts/Sahar-${{ env.SAHAR_VERSION }}-test-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sahar-Setup-${{ env.SAHAR_VERSION }}
          path: |
            artifacts/installer/Sahar-Setup-${{ env.SAHAR_VERSION }}.exe
            artifacts/installer/Sahar-Setup-${{ env.SAHAR_VERSION }}.exe.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui
          path: artifacts/ui/
      # The signing key (an Actions secret) reaches this step only, and only main may use it. A build that does not
      # publish never signs (no key needed); publishing without the key stops here, before anything is released.
      - name: Sign the update manifest (main only)
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          SAHAR_UPDATE_KEY: ${{ secrets.SAHAR_UPDATE_KEY }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "only main signs and publishes (this run is $env:GITHUB_REF)" }
          if (-not $env:SAHAR_UPDATE_KEY) { throw 'SAHAR_UPDATE_KEY (an Actions secret) is not set: a release cannot be published unsigned' }
          ./packaging/installer/manifest.ps1 -Version $env:SAHAR_VERSION -Setup "artifacts/installer/Sahar-Setup-$env:SAHAR_VERSION.exe" -Out artifacts/installer
      - name: Publish the "test-build" pre-release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "only main signs and publishes (this run is $env:GITHUB_REF)" }
          gh release delete test-build --yes --cleanup-tag 2>$null
          gh release create test-build "artifacts/Sahar-$env:SAHAR_VERSION-test-win-x64.zip" "artifacts/installer/Sahar-Setup-$env:SAHAR_VERSION.exe" "artifacts/installer/Sahar-Setup-$env:SAHAR_VERSION.exe.sha256" artifacts/installer/Sahar-update.json artifacts/installer/Sahar-update.json.sig artifacts/ui/gallery.png --prerelease `
            --target $env:GITHUB_SHA --title "Sahar $env:SAHAR_VERSION test build" `
            --notes "Test build ($env:GITHUB_SHA). Install: download Sahar-Setup-$env:SAHAR_VERSION.exe and run it (SmartScreen: More info, Run anyway). Portable: the zip, extract, run Sahar.Engine.exe. Sahar's own update check reads Sahar-update.json and checks its signature. See README-test-build.txt."
