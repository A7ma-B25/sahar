name: build

on:
  push:
    branches: [main, "v1/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Sahar.Core.Tests -c Release

  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (Native AOT, win-x64)
        run: dotnet publish src/Sahar.Engine -c Release -r win-x64 -o artifacts/engine
      - name: Check --version
        shell: pwsh
        run: |
          $out = & cmd /c "artifacts\engine\Sahar.Engine.exe --version > artifacts\version.txt 2>&1" ; $v = (Get-Content artifacts\version.txt -Raw).Trim()
          Write-Host "version: '$v'"
          if ($v -ne "Sahar 0.1.0") { throw "unexpected version output: '$v'" }
          Remove-Item artifacts/engine/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem artifacts/engine | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: engine-win-x64
          path: artifacts/engine/
