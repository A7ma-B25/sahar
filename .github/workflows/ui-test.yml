name: ui-test
# "ui-test all" is the title test-build looks for: a full pass on the same commit spares it the same run.
run-name: ui-test ${{ inputs.stages || 'all' }}

# Windows minutes are precious: on main pushes, or run by hand for a branch (gh workflow run ui-test.yml --ref <branch>).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stages:
        description: Stages to run (comma-separated), or all; a task runs the ones it touches, a release runs them all
        type: string
        default: all

concurrency:
  group: ui-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The stage list → parallel Windows jobs (tools/ci/ui_groups.py): all → four balanced groups, ≤ 3 stages → one job.
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        env:
          STAGES: ${{ inputs.stages || 'all' }}
        run: python3 -I tools/ci/ui_groups.py "$STAGES" | tee -a "$GITHUB_OUTPUT"

  # The engine is built once and shared with every UI job.
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Settings store on Windows (two writers, sharing violations, File.Replace)
        run: dotnet test tests/Sahar.Core.Tests -c Release --filter FullyQualifiedName~SettingsStore
      - name: Publish engine (Native AOT)
        run: dotnet publish src/Sahar.Engine -c Release -r win-x64 -o artifacts/engine
      - name: Publish the settings app (self-contained, next to the engine)
        run: dotnet publish src/Sahar.Settings -c Release -r win-x64 -o artifacts/engine/Sahar.Settings
      - name: Publish her brain's process (Native AOT, next to the engine)
        run: dotnet publish src/Sahar.Mind -c Release -r win-x64 -o artifacts/mind-exe
      - name: Her brain's runtime (official llama.cpp release, pinned SHA-256 and GitHub's digest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item artifacts/mind-exe/Sahar.Mind.exe artifacts/engine/
          ./tools/mind/fetch.ps1 -Runtime vulkan,cpu -Out artifacts/mind
          New-Item -ItemType Directory -Force -Path artifacts/engine/runtime | Out-Null
          Copy-Item artifacts/mind/runtime/cpu artifacts/engine/runtime/cpu -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: artifacts/engine/
          retention-days: 3

  ui:
    needs: [plan, build]
    name: ui (${{ matrix.group.name }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent-desktop
        run: npm i -g agent-desktop@1.2.0
      - name: The WebView2 runtime is installed (the settings app needs it)
        shell: pwsh
        run: |
          $key = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = @("HKLM:\SOFTWARE\WOW6432Node\$key", "HKCU:\Software\$key") | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if (-not $pv) { throw 'The WebView2 runtime is not installed on this runner: the settings app cannot run.' }
          Write-Host "WebView2 runtime $pv"
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: artifacts/engine
      # The mind stage's tiny model (plan Ruling 4, 291.5 MB): cached by its pin; never the 5 GB model.
      - uses: actions/cache@v4
        if: contains(matrix.group.stages, 'mind')
        with:
          path: artifacts/mind/downloads
          key: mind-ci-model-${{ hashFiles('tools/mind/pins.json') }}
      - name: The mind stage's tiny model (pinned)
        if: contains(matrix.group.stages, 'mind')
        shell: pwsh
        run: ./tools/mind/fetch.ps1 -Model -Out artifacts/mind
      - name: UI tests (${{ matrix.group.stages }})
        shell: pwsh
        env:
          STAGES: ${{ matrix.group.stages }}
        run: ./tests/ui/run.ps1 -Stage ($env:STAGES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.group.name }}
          path: artifacts/ui/
