name: build

on:
  push:
    branches: [main, "v1/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Sahar.Core.Tests -c Release
      - run: dotnet build src/Sahar.Settings -p:EnableWindowsTargeting=true
      - run: python3 -I -m unittest discover -s tools/art -p 'test_*.py' -v

  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Settings store on Windows (two writers, sharing violations, File.Replace)
        run: dotnet test tests/Sahar.Core.Tests -c Release --filter FullyQualifiedName~SettingsStore
      - name: Publish (Native AOT, win-x64)
        run: dotnet publish src/Sahar.Engine -c Release -r win-x64 -o artifacts/engine
      - name: Publish the settings app (self-contained)
        run: dotnet publish src/Sahar.Settings -c Release -r win-x64 -o artifacts/engine/Sahar.Settings
      - name: Check --version
        shell: pwsh
        run: |
          $out = & cmd /c "artifacts\engine\Sahar.Engine.exe --version > artifacts\version.txt 2>&1" ; $v = (Get-Content artifacts\version.txt -Raw).Trim()
          Write-Host "version: '$v'"
          $want = "Sahar " + (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          if ($v -ne $want) { throw "unexpected version output: '$v' (want '$want')" }
          Remove-Item artifacts/engine/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem artifacts/engine | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: engine-win-x64
          path: artifacts/engine/
