name: Spike build

# Builds the throwaway rendering spike as a Native AOT Windows exe and publishes it
# as the "spike" pre-release, so it can be downloaded and run without any tools.

on:
  push:
    branches: [main]
    paths: ["spike/**", ".github/workflows/spike.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spike
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (Native AOT, win-x64)
        run: dotnet publish spike/Spike/Spike.csproj -c Release -r win-x64 -o out/DeskCompanionSpike

      - name: Package
        shell: pwsh
        run: |
          Copy-Item spike/Run-A.cmd, spike/Run-B.cmd out/DeskCompanionSpike/
          Remove-Item out/DeskCompanionSpike/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem out/DeskCompanionSpike | Format-Table Name, Length
          Compress-Archive -Path out/DeskCompanionSpike -DestinationPath out/DeskCompanionSpike.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DeskCompanionSpike
          path: out/DeskCompanionSpike.zip

      - name: Publish the "spike" pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete spike --yes --cleanup-tag 2>$null
          gh release create spike out/DeskCompanionSpike.zip --prerelease --title "Spike build ($env:GITHUB_SHA)" --notes "Throwaway rendering spike. Download the zip, extract it, run Run-A.cmd or Run-B.cmd."
